# ローカルの動作確認用MySQL
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_test_password
      MYSQL_DATABASE: paint_test
      MYSQL_USER: paint_test_user
      MYSQL_PASSWORD: paint_test_password
    volumes:
      - mysql_test_data:/var/lib/mysql

  # イベント用アプリの配信
  web:
    image: nginx:stable-alpine
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/.htpasswd:/etc/nginx/.htpasswd:ro
    restart: unless-stopped

  # 比較用：現在の2次ベジェ版
  web-baseline:
    image: nginx:stable-alpine
    depends_on:
      - api
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./comparison/baseline:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/.htpasswd:/etc/nginx/.htpasswd:ro
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "127.0.0.1:8081:8000"
    volumes:
      - video_data:/data/videos
    restart: unless-stopped

volumes:
  mysql_test_data:
  video_data: