# ローカルの動作確認用MySQL
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_test_password
      MYSQL_DATABASE: paint_test
      MYSQL_USER: paint_test_user
      MYSQL_PASSWORD: paint_test_password
    volumes:
      - mysql_test_data:/var/lib/mysql

  # イベント用アプリの配信
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  mysql_test_data: